name: Deploy da Documentação

on:
  push:
    branches:
      - main

# O mkdocs gh-deploy empurra o site para a branch gh-pages, ou seja escreve no
# repositorio - o token precisa disso explicitamente.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      
      - name: Instalar mkdocs-material
        run: pip install mkdocs-material

      - name: Realizando deploy
        run: mkdocs gh-deploy --force
