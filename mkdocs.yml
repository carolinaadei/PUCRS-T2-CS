site_name: ViajaJunto - Documentação

copyright: Logo and Favicon made by <a href="https://www.freepik.com" title="Freepik">Freepik</a> from <a href="https://www.flaticon.com/" title="Flaticon">www.flaticon.com</a>

repo_name: carolinaadei/PUCRS-T2-CS
repo_url: https://github.com/carolinaadei/PUCRS-T2-CS

edit_uri: ""

theme:
  name: material

  logo: stylesheets/assets/logo.png

  favicon: stylesheets/assets/logo.png

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.tabs
    - navigation.top

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/carolinaadei/PUCRS-T2-CS

markdown_extensions:
  # O modulo `materialx` foi descontinuado: a logica de emoji passou para dentro
  # do mkdocs-material na versao 9.4, e o build avisa isso em todo deploy.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Artefatos:
    - Início: index.md
    - Documento de Requisitos: requirements.md
    - Documento de Arquitetura: architecture.md
    - Identidade Visual: visual_id.md
    - Pipeline de CI/CD: pipeline.md
    - Infraestrutura (MiniStack): infra-ministack.md
    - Happy path dos testes: happy-path.md
