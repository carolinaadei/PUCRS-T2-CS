# Configuracao da analise do SonarQube, consumida pelo job "sonarqube" do CI
# (.github/workflows/ci.yml), que roda o scanner com projectBaseDir=backend.
#
# Por que este arquivo vive em backend/ e nao na raiz: os relatorios lcov do Jest
# gravam caminhos relativos ao cwd do processo (backend/), como "src/app.module.ts".
# Com a raiz do repositorio como base, o Sonar procuraria esses arquivos um nivel
# acima, nao acharia nenhum, e descartaria a cobertura inteira em silencio - o
# Quality Gate passaria a reprovar por 0% sem explicacao obvia.

# Chaves do projeto no SonarQube Cloud. O projectKey e gerado por eles no formato
# <organizacao>_<repositorio> quando o projeto e importado do GitHub; mudar aqui
# sem mudar la resulta em "project not found" no CI.
sonar.projectKey=carolinaadei_PUCRS-T2-CS
sonar.organization=carolinaadei
sonar.projectName=ViajaJunto Backend

sonar.sourceEncoding=UTF-8

# Codigo de producao. Os testes sao declarados separadamente em sonar.tests para
# que problemas neles nao contem como divida do produto.
sonar.sources=src
sonar.tests=src,test

# Os testes unitarios moram junto do codigo (src/**/*.spec.ts). Sem este par
# inclusions/exclusions o scanner tentaria indexar o mesmo arquivo como fonte e
# como teste e abortaria com "can't be indexed twice".
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.ts
sonar.exclusions=src/**/*.spec.ts

# Os dois relatorios sao somados: o unitario cobre os services, o e2e cobre o que
# so passa pela camada HTTP (controllers, guards, pipes, filtros).
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-e2e/lcov.info

# Arquivos declarativos, sem ramificacao para exercitar: DTOs sao listas de
# decorators, modules sao fiacao do Nest e main.ts e o bootstrap. Mante-los no
# calculo puxaria a cobertura para baixo sem que houvesse teste util a escrever.
sonar.coverage.exclusions=src/main.ts,src/**/*.module.ts,src/**/dto/**,src/config/**,scripts/**,prisma/**

# Migrations sao SQL gerado pelo Prisma; nao sao codigo nosso para revisar.
sonar.cpd.exclusions=prisma/migrations/**
